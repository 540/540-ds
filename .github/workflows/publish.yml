# Publishes the component library to npm when a version tag (v0.1.0, v1.2.3…) is pushed.
# Authenticates with npm Trusted Publishing (OIDC): no token. The trusted publisher is set on npmjs.com
# (@540deg/ds → Settings → Trusted Publisher: 540/540-ds, publish.yml). Needs npm >= 11.5.1.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run lint
      - run: npm run test:ssr
      # The talk renderer ships in the package (pieces/ + the 540-ds-render bin); prepack rebuilds both.
      - run: npm run test:render
      - run: npm run check:pieces
      # The browser runtime (pieces/runtime/) must paint exactly what the renderer writes
      - run: npx playwright install --with-deps chromium
      - run: npm run check:runtime
      # A prerelease (0.2.0-rc.0) goes to the "next" dist-tag, so "latest" keeps pointing to the last stable version
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
