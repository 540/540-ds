# Checks the MCP server on every pull request and push to main.
# Separate from pages.yml so an MCP failure never blocks the Storybook deploy, nor the other way round.
# The metadata is built from src/, so any change to a component can affect the MCP: no path filter.
name: MCP

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types (scripts, mcp, api)
        run: npx tsc -p tsconfig.mcp.json --noEmit
      - name: Metadata, failing on any undocumented component
        run: npm run build-mcp-metadata -- --strict
      - name: Tests (tools and HTTP handler)
        run: npm run test:mcp
